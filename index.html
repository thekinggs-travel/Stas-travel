<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Путешествия</title>
<style>
:root{
  --paper:#f6f1e7; --card:#fffdf8; --ink:#1f2a2e; --muted:#6f7678; --line:#e3dbcb;
  --ocean:#e7e1d3; --land:#faf7f0; --land-stroke:#d5ccb9;
  --visited:#2e6b64; --visited-2:#3f8a81; --home:#cdb88f; --pin:#e0703f; --bucket:#e0703f;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:28px 24px 64px}

/* header */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
h1{font-family:var(--serif);font-weight:500;font-size:44px;line-height:1.05;margin:0}
.stats{display:flex;gap:22px;flex-wrap:wrap;margin-top:12px}
.stat b{display:block;font-family:var(--serif);font-size:26px;font-weight:500;line-height:1}
.stat span{font-size:12px;color:var(--muted)}
.actions{display:flex;gap:8px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 16px;font-size:14px;transition:background .15s,border-color .15s}
.btn:hover{border-color:#cfc5b1;background:#fff}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.primary:hover{background:#33434a}
.btn.danger{color:#b4442a}
.btn.small{padding:5px 12px;font-size:13px}
.editing .btn#editBtn{background:#fbe9df;border-color:#f0c4ad}

/* demo banner */
.banner{background:#fbe9df;border:1px solid #f0c4ad;border-radius:12px;padding:10px 14px;margin-bottom:16px;font-size:14px}

/* map */
.map-card{position:relative;background:var(--ocean);border-radius:20px;overflow:hidden;border:1px solid var(--line)}
#map{display:block;width:100%;height:auto;touch-action:none;cursor:grab}
#map:active{cursor:grabbing}
.country{fill:var(--land);stroke:var(--land-stroke);stroke-width:.6;vector-effect:non-scaling-stroke;transition:fill .15s}
.country.home{fill:var(--home)}
.country.bucket{fill:url(#hatch)}
.country.visited{fill:var(--visited);stroke:#7fa9a3}
.country.visited:hover,.country.visited.sel{fill:var(--visited-2)}
.country.home:hover{fill:#c2aa7c}
.graticule{fill:none;stroke:#d9d2c3;stroke-width:.5;vector-effect:non-scaling-stroke}
.pin{fill:var(--pin);stroke:#fff;cursor:pointer;vector-effect:non-scaling-stroke;stroke-width:1.5}
.pin.sel{fill:#c4511f}
.zoom{position:absolute;right:14px;top:14px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:rgba(255,253,248,.92);font-size:18px;line-height:1}
.legend{position:absolute;left:16px;bottom:14px;display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);background:rgba(255,253,248,.85);padding:6px 12px;border-radius:999px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font-size:13px;padding:7px 11px;border-radius:10px;white-space:nowrap;transform:translate(-50%,-120%);opacity:0;transition:opacity .1s}
.tip small{color:#b9c4c6;display:block}

/* log */
.log{margin-top:34px;display:grid;grid-template-columns:1fr 280px;gap:40px}
.log h2,.side h2{font-family:var(--serif);font-weight:500;font-size:26px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin-bottom:18px}
.filter{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 12px;font-size:13px;margin-bottom:14px}
.filter button{border:0;background:#eee7da;border-radius:999px;width:22px;height:22px}
.year{display:grid;grid-template-columns:86px 1fr;gap:16px;padding:16px 0;border-top:1px solid var(--line)}
.year-num{font-family:var(--serif);font-size:30px;line-height:1;color:#2b3a3f}
.year-flags{font-size:15px;margin-top:6px;letter-spacing:2px}
.trip{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;background:none;padding:8px 10px;margin:0 -10px;border-radius:12px}
.trip:hover{background:var(--card)}
.trip .flags{font-size:22px;min-width:30px;letter-spacing:1px}
.trip .t{flex:1;min-width:0}
.trip .t b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trip .t span{color:var(--muted);font-size:13px}
.trip .thumbs{display:flex}
.trip .thumbs img{width:46px;height:46px;object-fit:cover;border-radius:9px;border:2px solid var(--paper);margin-left:-14px;background:#ddd}
.trip .thumbs img:first-child{margin-left:0}
.trip .demo{font-size:11px;color:#b4442a;border:1px solid #f0c4ad;border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:1px}
.log-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.seg{display:inline-flex;background:#ece5d7;border-radius:999px;padding:3px}
.seg button{border:0;background:none;border-radius:999px;padding:5px 12px;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.year.short{align-items:center;padding:12px 0}
.year.short .year-num{font-size:24px}
.cbtn{cursor:pointer;background:var(--card);border:1px solid var(--line);font-size:14px;padding:5px 12px}
.cbtn:hover{border-color:#cfc5b1;background:#fff}
.ph{aspect-ratio:1;background:#e8e2d6;border-radius:10px}
.empty{color:var(--muted);padding:30px 0;border-top:1px solid var(--line)}

.side .box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;background:#f1ebdf;border-radius:999px;padding:4px 10px;font-size:13px;border:0}
.chip button{border:0;background:none;padding:0 0 0 2px;color:var(--muted)}
.clist{display:flex;flex-direction:column;gap:2px;max-height:420px;overflow:auto}
.clist button{display:flex;justify-content:space-between;border:0;background:none;padding:5px 6px;border-radius:8px;font-size:14px;text-align:left}
.clist button:hover{background:#f3eee4}
.clist small{color:var(--muted)}

/* modal */
.modal{position:fixed;inset:0;background:rgba(25,32,34,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:20}
.modal[hidden]{display:none}
.sheet{background:var(--card);border-radius:20px;max-width:820px;width:100%;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.hero{position:relative;height:300px;background:#cfd8d6 center/cover no-repeat}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 40%,rgba(0,0,0,.55))}
.hero .ht{position:absolute;left:28px;bottom:22px;right:28px;color:#fff;z-index:1}
.hero .ht h3{color:#fff}
.sheet-head{padding:26px 28px 0}
.sheet h3{font-family:var(--serif);font-weight:500;font-size:34px;margin:0;line-height:1.1}
.meta{color:var(--muted);margin-top:6px}
.hero .meta{color:#e8eeee}
.sheet-body{padding:20px 28px 28px}
.facts{display:grid;grid-template-columns:110px 1fr;gap:6px 16px;margin-bottom:18px;font-size:14px}
.facts dt{color:var(--muted)}
.facts dd{margin:0}
.notes{white-space:pre-wrap;font-size:15.5px;line-height:1.6;margin-bottom:20px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.gallery img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;cursor:zoom-in;background:#e8e2d6;display:block}
.sheet-foot{display:flex;justify-content:space-between;gap:8px;padding:0 28px 24px}
.close{position:absolute;right:14px;top:14px;z-index:2;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.9);font-size:20px}
.sheet{position:relative}

/* form */
.form{padding:26px 28px}
.form h3{margin-bottom:18px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;letter-spacing:.02em}
.field input,.field textarea{width:100%;font:inherit;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;color:var(--ink)}
.field textarea{min-height:110px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr 110px;gap:12px}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.ph-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-bottom:10px}
.ph{position:relative}
.ph img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;display:block}
.ph .ctl{position:absolute;top:5px;right:5px;display:flex;gap:4px}
.ph .ctl button{width:26px;height:26px;border-radius:50%;border:0;background:rgba(255,255,255,.92);font-size:13px}
.ph .cov{position:absolute;left:6px;bottom:6px;background:var(--ink);color:#fff;font-size:11px;padding:2px 7px;border-radius:999px}
.drop{border:1.5px dashed #cfc5b1;border-radius:12px;padding:18px;text-align:center;color:var(--muted);font-size:14px;cursor:pointer}
.drop.over{background:#f3ede1;border-color:var(--visited)}

/* lightbox */
.lb{position:fixed;inset:0;background:rgba(10,14,15,.94);z-index:40;display:flex;align-items:center;justify-content:center}
.lb[hidden]{display:none}
.lb img{max-width:92vw;max-height:88vh;border-radius:6px}
.lb button{position:absolute;border:0;background:rgba(255,255,255,.12);color:#fff;width:46px;height:46px;border-radius:50%;font-size:22px}
.lb .prev{left:18px}.lb .next{right:18px}.lb .x{top:18px;right:18px}
.lb .cnt{position:absolute;bottom:16px;color:#aab;font-size:13px}

.lock{position:fixed;inset:0;background:var(--paper);z-index:80;display:flex;align-items:center;justify-content:center;padding:20px}
.lock-card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:30px 28px;width:100%;max-width:380px}
.lock-err{color:#b4442a;font-size:13px;margin-top:10px;min-height:18px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}

@media (max-width:820px){
  .wrap{padding:20px 14px 48px}
  h1{font-size:34px}
  .log{grid-template-columns:1fr;gap:20px}
  .year{grid-template-columns:62px 1fr}
  .year-num{font-size:24px}
  .row{grid-template-columns:1fr 1fr}
  .hero{height:220px}
  .legend{display:none}
  .modal{padding:0}
  .sheet{border-radius:0;min-height:100vh}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">Travel log</div>
      <h1 id="title">Путешествия</h1>
      <div class="stats" id="stats"></div>
    </div>
    <div class="actions">
      <button class="btn" id="pubBtn" hidden>🌐 Онлайн-версия</button>
      <button class="btn primary" id="addBtn" hidden>+ Поездка</button>
      <button class="btn" id="editBtn">✎ Редактировать</button>
    </div>
  </header>

  <div id="banner"></div>

  <section class="map-card">
    <svg id="map"></svg>
    <div class="zoom">
      <button id="zin" title="Приблизить">+</button>
      <button id="zout" title="Отдалить">−</button>
      <button id="zreset" title="Весь мир" style="font-size:14px">⟲</button>
    </div>
    <div class="legend">
      <span><i style="background:var(--visited)"></i>был</span>
      <span><i style="background:var(--home)"></i>дом</span>
      <span><i style="background:repeating-linear-gradient(45deg,var(--bucket) 0 2px,var(--land) 2px 5px)"></i>хочу</span>
    </div>
    <div class="tip" id="tip"></div>
  </section>

  <section class="log">
    <div>
      <div class="log-head"><div><h2>По годам</h2><div class="sub" id="logSub"></div></div>
        <div class="seg"><button data-view="short">Кратко</button><button data-view="full">Подробно</button></div></div>
      <div id="filter"></div>
      <div id="years"></div>
    </div>
    <aside class="side">
      <div class="box">
        <h2 style="font-size:20px">Страны</h2>
        <div class="sub" id="cSub" style="margin-bottom:10px"></div>
        <div class="clist" id="clist"></div>
      </div>
      <div class="box">
        <h2 style="font-size:20px">Хочу поехать</h2>
        <div class="chips" id="bucket" style="margin-top:10px"></div>
        <div id="bucketAdd"></div>
      </div>
    </aside>
  </section>
</div>

<div class="modal" id="modal" hidden><div class="sheet" id="sheet"></div></div>
<div class="lb" id="lb" hidden>
  <img id="lbImg" alt="">
  <button class="prev" id="lbPrev">‹</button><button class="next" id="lbNext">›</button>
  <button class="x" id="lbX">×</button><div class="cnt" id="lbCnt"></div>
</div>
<div class="toast" id="toast"></div>
<datalist id="countryList"></datalist>
